# Allez Hop : notifications push (voir README, section Notifications).
name: Notifications

on:
  schedule:
    # Aux 15 minutes (décalé des heures pile, où GitHub est le plus chargé). Chaque téléphone reçoit
    # sa notification une seule fois par jour, à l'heure choisie dans l'app (ou dans les minutes qui suivent).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification test maintenant à tous les téléphones"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: notifications

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7 firebase-admin@12.7.0
      - run: node scripts/notifier.js
        env:
          TEST: ${{ inputs.test && '1' || '' }}
          VAPID_PUBLIC: "BPLiguWy_GAbMeOOUjC9ntf_WBSRb2ZOqvyhVmsx0YjaQcQFF5CeNYreHaQhU2vBBEaLouXgbRqnamHY9YVx-eM"   # même clé publique que dans app.js
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
